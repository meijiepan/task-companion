<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1">
<title>Task Companion · 任务伴侣</title>
<style>
:root{font-family:Inter,-apple-system,BlinkMacSystemFont,"PingFang SC","Microsoft YaHei",sans-serif;color:#203b31;background:#f5f8f4}*{box-sizing:border-box}body{margin:0}button,input,select{font:inherit}button{cursor:pointer}header{display:flex;align-items:center;justify-content:space-between;gap:12px;padding:18px 22px;border-bottom:1px solid #d9e7dd;background:#fff}header strong{font-size:18px;letter-spacing:-.02em}header span{display:block;color:#718b7a;font-size:12px;margin-top:3px}.shell{max-width:1050px;margin:0 auto;padding:26px 20px;display:grid;grid-template-columns:minmax(0,1fr) 280px;gap:20px}.card{background:#fff;border:1px solid #dbe8dd;border-radius:18px;box-shadow:0 8px 30px #244e3210;padding:22px}.side{align-self:start;position:sticky;top:20px}.top{display:flex;justify-content:space-between;align-items:center;gap:12px}.top h1{margin:0;font-size:25px;line-height:1.25}.muted{color:#719080;font-size:13px}.btn{border:1px solid #cfdfd2;background:#fff;color:#267357;border-radius:10px;padding:8px 12px}.btn:hover{background:#eef6ef}.btn.primary{background:#24815e;color:#fff;border-color:#24815e;font-weight:650}.btn.primary:hover{background:#1f6e51}.btn.warn{color:#a64739}.btn.small{padding:5px 8px;font-size:12px}.actions{display:flex;gap:8px;flex-wrap:wrap}.progress{height:9px;background:#e3eee5;border-radius:99px;overflow:hidden;margin:18px 0 5px}.progress b{display:block;background:#24815e;height:100%;width:0}.tree{margin:22px 0 18px}.row{display:flex;align-items:center;gap:9px;min-height:46px;border-radius:10px;padding:6px 8px;margin:2px 0}.row:hover{background:#f3f8f3}.row.active{background:#e6f3e9}.row input{accent-color:#24815e;width:17px;height:17px}.row .name{flex:1;text-align:left;border:0;background:transparent;color:#244c37;padding:5px 2px}.row.parent .name{font-weight:720}.row .tiny{opacity:.45;border:0;background:transparent;font-size:18px;color:#315b43;padding:3px 6px}.row:hover .tiny,.row.active .tiny{opacity:1}.empty{padding:40px 15px;text-align:center;color:#719080}.footer{display:flex;gap:8px;flex-wrap:wrap;padding-top:10px;border-top:1px solid #e5eee6}.footer .btn{flex:1}.notice{margin-top:12px;min-height:18px;font-size:12px;color:#648470}.side h2{font-size:17px;margin:0 0 12px}.side p{color:#5d7967;font-size:14px;line-height:1.6}.side .btn{width:100%;margin:5px 0}.side hr{border:0;border-top:1px solid #e5eee6;margin:17px 0}.select{max-width:100%;border:1px solid #d7e5da;border-radius:9px;background:#fff;color:#2b5d43;padding:8px}.login{max-width:620px;margin:11vh auto;padding:36px}.login h1{margin-top:0}.login p{line-height:1.65;color:#5f7969}@media(max-width:750px){.shell{display:block;padding:12px}.card{padding:16px}.side{position:static;margin-top:14px}.top h1{font-size:21px}}@media(max-width:460px){header{padding:14px}.row .tiny{opacity:1}.actions .btn{font-size:12px}}
</style>
</head>
<body>
<header><div><strong>Task Companion</strong><span id="tagline">让任务始终留在对话旁</span></div><button class="btn" id="lang">English</button></header>
<main id="root"></main>
<script id="app-script">
const embedded=!!window.TASK_COMPANION_EMBEDDED;
const storage={get(k){try{return localStorage.getItem(k)}catch{return null}},set(k,v){try{localStorage.setItem(k,v)}catch{}},remove(k){try{localStorage.removeItem(k)}catch{}}};
let locale=storage.get('tc-locale')||'zh',data=null,projectId=storage.get('tc-project')||'',status='',loading=true;
let rpcId=0;const pending=new Map();
const bridgeReady=embedded&&!window.openai?.callTool?new Promise((resolve,reject)=>{const id=++rpcId;pending.set(id,{resolve,reject});parent.postMessage({jsonrpc:'2.0',id,method:'ui/initialize',params:{appInfo:{name:'task-companion',version:'1.0.0'},appCapabilities:{},protocolVersion:'2026-01-26'}},'*')}).then(()=>parent.postMessage({jsonrpc:'2.0',method:'ui/notifications/initialized',params:{}},'*')):Promise.resolve();
addEventListener('message',e=>{if(e.source!==parent||e.data?.jsonrpc!=='2.0')return;const p=pending.get(e.data.id);if(p){pending.delete(e.data.id);e.data.error?p.reject(e.data.error):p.resolve(e.data.result)}});
const W={
 zh:{tag:'让任务始终留在对话旁',loading:'正在加载任务…',login:'登录后开始使用',intro:'创建项目、安排多层任务，并在 ChatGPT 对话旁继续推进。你的任务只对你的账号可见。',sign:'使用 ChatGPT 登录',project:'项目',newProject:'新建项目',demo:'创建示例项目',add:'添加任务',sub:'添加子任务',rename:'重命名',del:'删除',done:(d,t)=>'已完成 '+d+'/'+t,empty:'还没有任务。先添加一项吧。',noProjects:'还没有项目。创建自己的项目，或者试试示例。',prev:'上一步',next:'下一步',chat:'围绕当前任务继续聊天',copy:'复制当前任务并回到聊天',export:'导出我的数据',erase:'删除我的所有数据',privacy:'隐私与使用条款',projectName:'项目名称（中文）',englishName:'英文名称（可选）',taskName:'任务名称（中文）',confirmTask:'确定删除这项任务和全部子任务吗？',confirmProject:'确定删除这个项目及全部任务吗？',confirmAll:'输入 DELETE 以永久删除所有项目和任务',selected:'请选择一个任务',copied:'已复制任务提示',sent:'已发送到当前对话',saved:'已保存',error:'操作失败：',privacyText:'任务内容保存在云端，与你的 ChatGPT 登录身份关联。你可导出或删除全部数据。'},
 en:{tag:'Keep tasks beside your conversation',loading:'Loading tasks…',login:'Sign in to start',intro:'Create projects, organize nested tasks, and keep working beside your ChatGPT conversation. Your tasks are private to your account.',sign:'Sign in with ChatGPT',project:'Project',newProject:'New project',demo:'Create demo project',add:'Add task',sub:'Add subtask',rename:'Rename',del:'Delete',done:(d,t)=>d+'/'+t+' completed',empty:'No tasks yet. Add your first one.',noProjects:'No projects yet. Create one or try the demo.',prev:'Previous',next:'Next',chat:'Continue current task in chat',copy:'Copy current task for chat',export:'Export my data',erase:'Delete all my data',privacy:'Privacy and terms',projectName:'Project name (Chinese)',englishName:'English name (optional)',taskName:'Task name (Chinese)',confirmTask:'Delete this task and all its subtasks?',confirmProject:'Delete this project and all its tasks?',confirmAll:'Type DELETE to permanently delete all projects and tasks',selected:'Select a task first',copied:'Task prompt copied',sent:'Sent to this conversation',saved:'Saved',error:'Action failed: ',privacyText:'Tasks are stored in the cloud and linked to your ChatGPT sign-in. You can export or delete all data.'}
};
const $=id=>document.getElementById(id),w=()=>W[locale],label=x=>locale==='en'?x.title_en||x.title_zh:x.title_zh;
function unpack(x){if(x?.structuredContent)return x.structuredContent;const t=x?.content?.find(c=>c.type==='text')?.text;if(t){try{return JSON.parse(t)}catch{throw Error(t)}}return x}
async function bridge(name,args){if(window.openai?.callTool)return unpack(await window.openai.callTool(name,args));await bridgeReady;return unpack(await new Promise((resolve,reject)=>{const id=++rpcId;pending.set(id,{resolve,reject});parent.postMessage({jsonrpc:'2.0',id,method:'tools/call',params:{name,arguments:args}},'*')}))}
async function api(name,args={}){try{let result;if(embedded)result=await bridge(name,args);else{const r=await fetch(name==='get_tasks'?'/api/state'+(args.project_id?'?project_id='+encodeURIComponent(args.project_id):''):'/api/action',{method:name==='get_tasks'?'GET':'POST',headers:name==='get_tasks'?{}:{'content-type':'application/json'},body:name==='get_tasks'?undefined:JSON.stringify({name,args})});result=await r.json();if(!r.ok)throw Error(result.error||r.status)}if(result?.error)throw Error(result.error);if(result?.projects){data=result;loading=false;projectId=data.project?.id||'';storage.set('tc-project',projectId);status=w().saved;render()}return result}catch(e){if(name==='get_tasks'&&args.project_id&&/Project not found/.test(String(e.message||e))){projectId='';storage.remove('tc-project');return api('get_tasks',{})}loading=false;status=w().error+String(e.message||e);render();throw e}}
function btn(text,fn,extra=''){const b=document.createElement('button');b.className='btn '+extra;b.textContent=text;b.onclick=fn;return b}
function selected(){return data?.tasks?.find(x=>x.id===data.project?.selected_task_id)}
function leaves(){return (data?.tasks||[]).filter(x=>!data.tasks.some(y=>y.parent_id===x.id))}
function depth(t){let n=0,p=t.parent_id;while(p&&n<10){n++;p=data.tasks.find(x=>x.id===p)?.parent_id}return n}
function render(){
 document.documentElement.lang=locale==='en'?'en':'zh-CN';$('tagline').textContent=w().tag;$('lang').textContent=locale==='zh'?'English':'中文';
 const root=$('root');root.replaceChildren();
 if(!data){const box=document.createElement('div');box.className='card login';box.innerHTML='<h1></h1><p></p>';box.querySelector('h1').textContent=loading?w().loading:w().login;box.querySelector('p').textContent=loading?'':w().intro;if(!loading){const link=document.createElement('a');link.href='/signin-with-chatgpt?return_to=%2F';link.target='_top';link.className='btn primary';link.textContent=w().sign;box.append(link)}root.append(box);return}
 const shell=document.createElement('div');shell.className='shell',main=document.createElement('section');main.className='card',aside=document.createElement('aside');aside.className='card side';shell.append(main,aside);root.append(shell);
 const top=document.createElement('div');top.className='top';const h=document.createElement('h1');h.textContent=data.project?label(data.project):w().project;top.append(h);main.append(top);
 const controls=document.createElement('div');controls.className='actions';controls.style.marginTop='14px';
 const select=document.createElement('select');select.className='select';for(const p of data.projects){const o=document.createElement('option');o.value=p.id;o.textContent=label(p);o.selected=p.id===projectId;select.append(o)}select.onchange=()=>api('get_tasks',{project_id:select.value});if(data.projects.length)controls.append(select);
 controls.append(btn(w().newProject,newProject),btn(w().demo,()=>api('create_demo_project',{})));
 main.append(controls);
 if(!data.project){const e=document.createElement('div');e.className='empty';e.textContent=w().noProjects;main.append(e);return}
 const bar=document.createElement('div');bar.className='progress';const fill=document.createElement('b');fill.style.width=data.progress.total?Math.round(100*data.progress.done/data.progress.total)+'%':'0%';bar.append(fill);main.append(bar);
 const count=document.createElement('div');count.className='muted';count.textContent=w().done(data.progress.done,data.progress.total);main.append(count);
 const tree=document.createElement('div');tree.className='tree';main.append(tree);
 if(!data.tasks.length){const e=document.createElement('div');e.className='empty';e.textContent=w().empty;tree.append(e)}
 for(const t of data.tasks){const row=document.createElement('div');row.className='row'+(t.id===data.project.selected_task_id?' active':'')+(data.tasks.some(x=>x.parent_id===t.id)?' parent':'');row.style.paddingLeft=(8+Math.min(depth(t),7)*18)+'px';
 const checkbox=document.createElement('input');checkbox.type='checkbox';checkbox.checked=!!t.completed_at;checkbox.disabled=data.tasks.some(x=>x.parent_id===t.id);checkbox.setAttribute('aria-label',label(t));checkbox.onchange=()=>api('set_task_status',{project_id:projectId,task_id:t.id,completed:checkbox.checked}).catch(()=>checkbox.checked=!checkbox.checked);
 const name=document.createElement('button');name.className='name';name.textContent=label(t);name.onclick=()=>api('select_task',{project_id:projectId,task_id:t.id});
 const more=document.createElement('button');more.className='tiny';more.textContent='···';more.title=w().rename+' / '+w().del;more.onclick=()=>taskMenu(t);
 row.append(checkbox,name,more);tree.append(row)}
 const footer=document.createElement('div');footer.className='footer';footer.append(btn(w().add,()=>addTask(null),'primary'),btn(w().sub,()=>addTask(selected()?.id),selected()?'':'disabled'));
 const list=leaves(),i=list.findIndex(x=>x.id===data.project.selected_task_id),prev=btn(w().prev,()=>api('select_task',{project_id:projectId,task_id:list[i-1].id})),next=btn(w().next,()=>api('select_task',{project_id:projectId,task_id:list[i+1].id}));prev.disabled=i<=0;next.disabled=i<0||i>=list.length-1;footer.append(prev,next);main.append(footer);
 const notice=document.createElement('div');notice.className='notice';notice.textContent=status;main.append(notice);
 const heading=document.createElement('h2');heading.textContent=selected()?label(selected()):w().selected;aside.append(heading);
 const p=document.createElement('p');p.textContent=w().privacyText;aside.append(p);
 aside.append(btn(embedded?w().chat:w().copy,continueChat,'primary'),document.createElement('hr'),btn(w().rename,()=>renameProject()),btn(w().del,()=>deleteProject(),'warn'),document.createElement('hr'),btn(w().export,exportData),btn(w().erase,eraseData,'warn'));
 const privacy=document.createElement('a');privacy.href='/privacy';privacy.textContent=w().privacy;privacy.style.display='block';privacy.style.marginTop='16px';privacy.style.color='#277c5c';aside.append(privacy);
}
async function newProject(){const zh=prompt(w().projectName);if(!zh)return;const en=prompt(w().englishName)||zh;await api('create_project',{title_zh:zh,title_en:en})}
async function addTask(parent){if(parent===undefined){status=w().selected;render();return}const zh=prompt(w().taskName);if(!zh)return;const en=prompt(w().englishName)||zh;await api('add_subtask',{project_id:projectId,parent_id:parent,title_zh:zh,title_en:en})}
async function taskMenu(t){const choice=prompt(w().rename+' = R, '+w().del+' = D','R');if(!choice)return;if(choice.toUpperCase()==='R'){const zh=prompt(w().taskName,t.title_zh);if(zh)await api('rename_task',{project_id:projectId,task_id:t.id,title_zh:zh,title_en:prompt(w().englishName,t.title_en)||zh})}else if(choice.toUpperCase()==='D'&&confirm(w().confirmTask))await api('delete_task',{project_id:projectId,task_id:t.id})}
async function renameProject(){const p=data.project,zh=prompt(w().projectName,p.title_zh);if(zh)await api('rename_project',{project_id:projectId,title_zh:zh,title_en:prompt(w().englishName,p.title_en)||zh})}
async function deleteProject(){if(confirm(w().confirmProject))await api('delete_project',{project_id:projectId})}
async function exportData(){const content=await api('export_data',{}),blob=new Blob([JSON.stringify(content,null,2)],{type:'application/json'}),url=URL.createObjectURL(blob),a=document.createElement('a');a.href=url;a.download='task-companion-export.json';a.click();setTimeout(()=>URL.revokeObjectURL(url),1000)}
async function eraseData(){if(prompt(w().confirmAll)!=='DELETE')return;await api('delete_my_data',{confirm:'DELETE'});await api('get_tasks',{})}
async function continueChat(){const t=selected();if(!t){status=w().selected;render();return}const message=locale==='zh'?'请继续指导我完成“'+label(t)+'”。项目：'+label(data.project)+'。请先读取 Task Companion 的最新任务状态，只有我要求时才修改。':'Help me complete “'+label(t)+'” in “'+label(data.project)+'”. Read the latest Task Companion state first; change it only when I ask.';try{if(embedded&&window.openai?.sendFollowUpMessage){await window.openai.sendFollowUpMessage({prompt:message});status=w().sent}else{await navigator.clipboard.writeText(message);status=w().copied}render()}catch(e){status=w().error+e.message;render()}}
$('lang').onclick=()=>{locale=locale==='zh'?'en':'zh';storage.set('tc-locale',locale);render()};
render();api('get_tasks',projectId?{project_id:projectId}:{}).catch(()=>{data=null;render()});
</script>
</body></html>
